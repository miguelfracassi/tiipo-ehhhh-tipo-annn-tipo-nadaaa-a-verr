<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Inscrições · /join · Ticord</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Silkscreen:wght@400;700&display=swap"><link rel="stylesheet" href="/site.css"><style>
body{padding-top:0}.ad{max-width:960px;margin:0 auto;padding:28px 20px 60px}
.ad h1{font-size:clamp(1.5rem,4vw,2.1rem);margin:0 0 6px}.ad .lead{margin:0 0 22px;font-size:1rem}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.bar input{flex:1;min-width:180px;padding:11px 18px}
.bar .btn{padding:10px 18px;font-size:.9rem}.cnt{font-weight:700;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:8px 16px}
.tw{overflow-x:auto;background:#fff;border:2px solid var(--ink);border-radius:24px;box-shadow:6px 6px 0 var(--ink)}
table{width:100%;border-collapse:collapse;min-width:520px}th,td{text-align:left;padding:12px 16px;border-bottom:1px solid #e4e4ea;white-space:nowrap}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:#555}tr:last-child td{border-bottom:0}td a{font-weight:700;color:#1b7f3b}
.x{all:unset;cursor:pointer;color:#c62828;font-weight:700;padding:2px 8px;border-radius:8px}.x:hover{background:#fde8e8}.x:focus-visible{outline:3px solid var(--b)}
.empty{text-align:center;padding:30px;color:#666}.login{max-width:420px;margin:12vh auto 0}.login form{display:grid;gap:12px}
</style></head><body><main class="ad">
<section class="card login" id="lg"><h1>Administração · Ticord</h1><p class="lead">Inscrições da página /join. Digite a chave de acesso.</p>
<form id="lf"><input id="key" type="password" autocomplete="current-password" placeholder="Chave de acesso" required><p class="err" id="le" role="alert"></p><button class="btn" type="submit">Entrar</button></form></section>
<section id="pn" hidden><h1>Inscrições do /join</h1><p class="lead">Quem pediu aviso para a inauguração do Bup.</p>
<div class="bar"><input id="q" type="search" placeholder="Buscar por nome ou telefone"><span class="cnt" id="ct">0</span><button class="btn alt" id="rf" type="button">Atualizar</button><button class="btn" id="csv" type="button">Baixar CSV</button><button class="btn alt" id="out" type="button">Sair</button></div>
<div class="tw"><table><thead><tr><th>#</th><th>Nome</th><th>Telefone</th><th>Quando</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></section>
</main><script>
(()=>{
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let key='',rows=[];try{key=sessionStorage.getItem('adm')||''}catch(e){}
const fmtP=p=>{const d=String(p).replace(/^55/,'');return d.length===11?`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`:`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`};
const fmtD=t=>new Date(t).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
const api=(m,q='')=>fetch('/api/admin-waitlist'+q,{method:m,headers:{'x-admin-key':key}}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||'Erro'),{st:r.status});return j});
const draw=()=>{const q=$('#q').value.trim().toLowerCase(),qd=q.replace(/\D/g,''),l=rows.filter(r=>!q||r.name.toLowerCase().includes(q)||(qd&&r.phone.includes(qd)));
 $('#ct').textContent=l.length+(l.length===rows.length?' inscritos':' de '+rows.length);
 $('#tb').innerHTML=l.length?l.map((r,i)=>`<tr><td>${rows.length-rows.indexOf(r)}</td><td>${esc(r.name)}</td><td><a href="https://wa.me/${esc(r.phone)}" target="_blank" rel="noopener">${esc(fmtP(r.phone))}</a></td><td>${esc(fmtD(r.created_at))}</td><td><button class="x" data-id="${r.id}" type="button" aria-label="Remover ${esc(r.name)}">Remover</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">Nenhuma inscrição ainda.</td></tr>'};
const load=async()=>{const j=await api('GET');rows=j.rows;$('#lg').hidden=true;$('#pn').hidden=false;draw()};
const bye=()=>{key='';try{sessionStorage.removeItem('adm')}catch(e){}$('#pn').hidden=true;$('#lg').hidden=false;$('#key').value=''};
$('#lf').onsubmit=async e=>{e.preventDefault();$('#le').textContent='';key=$('#key').value;try{await load();try{sessionStorage.setItem('adm',key)}catch(x){}}catch(x){$('#le').textContent=x.message}};
$('#q').oninput=draw;$('#rf').onclick=()=>load().catch(x=>x.st===401?bye():alert(x.message));$('#out').onclick=bye;
$('#tb').onclick=async e=>{const b=e.target.closest('.x');if(!b||!confirm('Remover esta inscrição?'))return;try{await api('DELETE','?id='+b.dataset.id);rows=rows.filter(r=>r.id!=b.dataset.id);draw()}catch(x){alert(x.message)}};
$('#csv').onclick=()=>{const q=s=>'"'+String(s).replace(/"/g,'""')+'"',t='\ufeffnome,telefone,data\n'+rows.map(r=>[q(r.name),q('+'+r.phone),q(fmtD(r.created_at))].join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download='inscricoes-join.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
if(key)load().catch(bye);
})();
</script></body></html>
